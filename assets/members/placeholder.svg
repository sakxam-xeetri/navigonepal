<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2342" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" fill="url(#avatarGrad)" />
  
  <!-- Icon Grid Pattern in background -->
  <g opacity="0.08">
    <line x1="20" y1="0" x2="20" y2="200" stroke="#ffffff" stroke-width="0.5" />
    <line x1="40" y1="0" x2="40" y2="200" stroke="#ffffff" stroke-width="0.5" />
    <line x1="60" y1="0" x2="60" y2="200" stroke="#ffffff" stroke-width="0.5" />
    <line x1="80" y1="0" x2="80" y2="200" stroke="#ffffff" stroke-width="0.5" />
    <line x1="100" y1="0" x2="100" y2="200" stroke="#ffffff" stroke-width="0.5" />
    <line x1="120" y1="0" x2="120" y2="200" stroke="#ffffff" stroke-width="0.5" />
    <line x1="140" y1="0" x2="140" y2="200" stroke="#ffffff" stroke-width="0.5" />
    <line x1="160" y1="0" x2="160" y2="200" stroke="#ffffff" stroke-width="0.5" />
    <line x1="180" y1="0" x2="180" y2="200" stroke="#ffffff" stroke-width="0.5" />
    
    <line x1="0" y1="20" x2="200" y2="20" stroke="#ffffff" stroke-width="0.5" />
    <line x1="0" y1="40" x2="200" y2="40" stroke="#ffffff" stroke-width="0.5" />
    <line x1="0" y1="60" x2="200" y2="60" stroke="#ffffff" stroke-width="0.5" />
    <line x1="0" y1="80" x2="200" y2="80" stroke="#ffffff" stroke-width="0.5" />
    <line x1="0" y1="100" x2="200" y2="100" stroke="#ffffff" stroke-width="0.5" />
    <line x1="0" y1="120" x2="200" y2="120" stroke="#ffffff" stroke-width="0.5" />
    <line x1="0" y1="140" x2="200" y2="140" stroke="#ffffff" stroke-width="0.5" />
    <line x1="0" y1="160" x2="200" y2="160" stroke="#ffffff" stroke-width="0.5" />
    <line x1="0" y1="180" x2="200" y2="180" stroke="#ffffff" stroke-width="0.5" />
  </g>
  
  <!-- Stylized Figure -->
  <g filter="url(#subtle-shadow)">
    <!-- Head -->
    <circle cx="100" cy="75" r="30" fill="#ffffff" opacity="0.95" />
    <!-- Shoulders/Body -->
    <path d="M45 160 C45 130, 65 125, 100 125 C135 125, 155 130, 155 160 C155 170, 145 175, 100 175 C55 175, 45 170, 45 160 Z" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
